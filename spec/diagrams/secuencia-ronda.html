<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><title>Secuencia: jugar una ronda (HU-02 · empate HU-03)</title><style>:root{--bg:#0b1220;--fg:#e2e8f0;--txt:#f1f5f9;--muted:#64748b;--sub:#8ea0b8;--edge:#94a3b8;--edge-label:#a5b4c9;--chip-bg:#0b1220;--chip-bd:#1e293b;--panel-bg:#0f172a;--panel-bd:#1e293b;--life:#334155;--act-bg:#1e293b;--act-bd:#475569;--seq-msg:#cbd5e1;--seq-ret:#64748b;--shadow:rgba(0,0,0,.35)}:root[data-theme=claro]{--bg:#eef2f7;--fg:#1e293b;--txt:#0f172a;--muted:#64748b;--sub:#5b6b80;--edge:#64748b;--edge-label:#475569;--chip-bg:#ffffff;--chip-bd:#cbd5e1;--panel-bg:#ffffff;--panel-bd:#e2e8f0;--life:#cbd5e1;--act-bg:#e2e8f0;--act-bd:#94a3b8;--seq-msg:#334155;--seq-ret:#94a3b8;--shadow:rgba(15,23,42,.10)}body{background:var(--bg);margin:0;padding:2.2rem;font-family:system-ui;color:var(--fg)}svg{width:100%;max-width:1180px;height:auto;display:block;margin:0 auto}.node,.edge,.chip,.hull,.msg,.life,.act{transition:opacity .18s}.insights{display:flex;gap:1rem;max-width:1180px;margin:1.2rem auto 0;flex-wrap:wrap}.ins{flex:1;min-width:250px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem}.ins b{display:flex;align-items:center;gap:.5rem;font-size:13.5px;color:var(--txt)}.ins .dot{width:9px;height:9px;border-radius:50%;flex:none}.ins ul{margin:.55rem 0 0;padding-left:1.1rem;font-size:12.5px;color:var(--sub);line-height:1.45}.ins li{margin:.28rem 0}#det{display:none;position:fixed;left:2rem;bottom:2rem;max-width:360px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem;box-shadow:0 8px 30px var(--shadow);z-index:9}#toolbar{position:fixed;top:1rem;right:1rem;display:flex;gap:.35rem;z-index:10}#toolbar button{background:var(--panel-bg);border:1px solid var(--panel-bd);color:var(--fg);border-radius:8px;padding:.28rem .55rem;cursor:pointer;font-size:12.5px;font-weight:650}#toolbar button:hover{border-color:var(--edge)}</style></head><body><div id='toolbar'><button id='btn-tema' title='Tema claro/oscuro'>☀</button><button id='btn-zmenos' title='Reducir tamano de fuente'>A−</button><button id='btn-zreset' title='Tamano original'>A</button><button id='btn-zmas' title='Aumentar tamano de fuente'>A+</button></div><div id='stage'><svg viewBox="0 0 1310 742" xmlns="http://www.w3.org/2000/svg" font-family="system-ui"><defs><marker id="a1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" style="fill:var(--seq-msg)"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" style="fill:var(--seq-ret)"/></marker></defs><text x="60" y="48" style="fill:var(--txt)" font-size="23" font-weight="700">Secuencia: jugar una ronda (HU-02 · empate HU-03)</text><text x="60" y="70" style="fill:var(--muted)" font-size="12">derivado de IR · no editar a mano · clic en un participante para su detalle</text><g class="node" data-id="jugador" data-tipo="ui" style="cursor:pointer"><rect x="62.0" y="93" width="200" height="56" rx="12" style="fill:var(--shadow)"/><rect class="card" x="60.0" y="90" width="200" height="56" rx="12" fill="#38bdf814" stroke="#38bdf8" stroke-width="1.4"/><circle cx="81.0" cy="112" r="10" fill="#38bdf826" stroke="#38bdf899"/><text x="81.0" y="116" fill="#38bdf8" font-size="10.5" text-anchor="middle">◉</text><text x="100.0" y="116" style="fill:var(--txt)" font-size="13" font-weight="650">Jugador</text><text x="100.0" y="133" style="fill:var(--sub)" font-size="10.5"></text><g class="ubadge"><rect x="186" y="82" width="69" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#38bdf8" stroke-width="0.9"/><text x="220" y="93.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">⌂ on-premise</text></g></g><line class="life" data-id="jugador" x1="160.0" y1="146" x2="160.0" y2="696" style="stroke:var(--life)" stroke-width="1.2" stroke-dasharray="4 5"/><g class="node" data-id="spa" data-tipo="ui" style="cursor:pointer"><rect x="392.0" y="93" width="200" height="56" rx="12" style="fill:var(--shadow)"/><rect class="card" x="390.0" y="90" width="200" height="56" rx="12" fill="#38bdf814" stroke="#38bdf8" stroke-width="1.4"/><circle cx="411.0" cy="112" r="10" fill="#38bdf826" stroke="#38bdf899"/><text x="411.0" y="116" fill="#38bdf8" font-size="10.5" text-anchor="middle">◉</text><text x="430.0" y="116" style="fill:var(--txt)" font-size="13" font-weight="650">React SPA</text><text x="430.0" y="133" style="fill:var(--sub)" font-size="10.5"></text><g class="ubadge"><rect x="509" y="82" width="76" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#38bdf8" stroke-width="0.9"/><text x="547" y="93.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">◈ GitHub Pages</text></g></g><line class="life" data-id="spa" x1="490.0" y1="146" x2="490.0" y2="696" style="stroke:var(--life)" stroke-width="1.2" stroke-dasharray="4 5"/><g class="node" data-id="api" data-tipo="service" style="cursor:pointer"><rect x="722.0" y="93" width="200" height="56" rx="12" style="fill:var(--shadow)"/><rect class="card" x="720.0" y="90" width="200" height="56" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="741.0" cy="112" r="10" fill="#a78bfa26" stroke="#a78bfa99"/><text x="741.0" y="116" fill="#a78bfa" font-size="10.5" text-anchor="middle">⟨⟩</text><text x="760.0" y="116" style="fill:var(--txt)" font-size="13" font-weight="650">FastAPI</text><text x="760.0" y="133" style="fill:var(--sub)" font-size="10.5"></text><g class="ubadge"><rect x="860" y="82" width="55" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#a78bfa" stroke-width="0.9"/><text x="888" y="93.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ Railway</text></g></g><line class="life" data-id="api" x1="820.0" y1="146" x2="820.0" y2="696" style="stroke:var(--life)" stroke-width="1.2" stroke-dasharray="4 5"/><g class="node" data-id="db" data-tipo="db" style="cursor:pointer"><rect x="1052.0" y="93" width="200" height="56" rx="12" style="fill:var(--shadow)"/><rect class="card" x="1050.0" y="90" width="200" height="56" rx="12" fill="#34d39914" stroke="#34d399" stroke-width="1.4"/><circle cx="1071.0" cy="112" r="10" fill="#34d39926" stroke="#34d39999"/><text x="1071.0" y="116" fill="#34d399" font-size="10.5" text-anchor="middle">⛁</text><text x="1090.0" y="116" style="fill:var(--txt)" font-size="13" font-weight="650">SQLite</text><text x="1090.0" y="133" style="fill:var(--sub)" font-size="10.5"></text><g class="ubadge"><rect x="1190" y="82" width="55" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#34d399" stroke-width="0.9"/><text x="1218" y="93.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ Railway</text></g></g><line class="life" data-id="db" x1="1150.0" y1="146" x2="1150.0" y2="696" style="stroke:var(--life)" stroke-width="1.2" stroke-dasharray="4 5"/><g class="msg" data-f="jugador" data-t="spa"><line x1="169.0" y1="214" x2="481.0" y2="214" style="stroke:var(--seq-msg)" stroke-width="1.6" marker-end="url(#a1)"/><rect x="208" y="188" width="235" height="19" rx="9.5" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><circle cx="220" cy="197.5" r="7.5" fill="#38bdf822" stroke="#38bdf8"/><text x="220" y="201" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">1</text><text x="233" y="201.5" style="fill:var(--edge-label)" font-size="10.5">1. elige el atributo de su carta</text></g><g class="msg" data-f="spa" data-t="api"><line x1="499.0" y1="278" x2="811.0" y2="278" style="stroke:var(--seq-msg)" stroke-width="1.6" marker-end="url(#a1)"/><rect x="512" y="252" width="286" height="19" rx="9.5" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><circle cx="524" cy="261.5" r="7.5" fill="#38bdf822" stroke="#38bdf8"/><text x="524" y="265" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">2</text><text x="537" y="265.5" style="fill:var(--edge-label)" font-size="10.5">2. POST /partidas/{id}/rondas {atributo}</text></g><g class="msg" data-f="api" data-t="db"><line x1="829.0" y1="342" x2="1141.0" y2="342" style="stroke:var(--seq-msg)" stroke-width="1.6" marker-end="url(#a1)"/><rect x="855" y="316" width="260" height="19" rx="9.5" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><circle cx="867" cy="325.5" r="7.5" fill="#38bdf822" stroke="#38bdf8"/><text x="867" y="329" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">3</text><text x="880" y="329.5" style="fill:var(--edge-label)" font-size="10.5">3. lee cartas y estado de la partida</text></g><g class="msg" data-f="api" data-t="api"><line x1="811.0" y1="406" x2="829.0" y2="406" style="stroke:var(--seq-msg)" stroke-width="1.6" marker-end="url(#a1)"/><rect x="655" y="380" width="331" height="19" rx="9.5" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><circle cx="667" cy="389.5" r="7.5" fill="#38bdf822" stroke="#38bdf8"/><text x="667" y="393" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">4</text><text x="680" y="393.5" style="fill:var(--edge-label)" font-size="10.5">4. compara vs IA · aplica reglas de empate (RN)</text></g><g class="msg" data-f="api" data-t="db"><line x1="829.0" y1="470" x2="1141.0" y2="470" style="stroke:var(--seq-msg)" stroke-width="1.6" marker-end="url(#a1)"/><rect x="887" y="444" width="196" height="19" rx="9.5" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><circle cx="899" cy="453.5" r="7.5" fill="#38bdf822" stroke="#38bdf8"/><text x="899" y="457" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">5</text><text x="912" y="457.5" style="fill:var(--edge-label)" font-size="10.5">5. INSERT ronda + puntajes</text></g><g class="msg" data-f="api" data-t="spa"><line x1="811.0" y1="534" x2="499.0" y2="534" style="stroke:var(--seq-msg)" stroke-width="1.6" marker-end="url(#a1)"/><rect x="490" y="508" width="331" height="19" rx="9.5" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><circle cx="502" cy="517.5" r="7.5" fill="#38bdf822" stroke="#38bdf8"/><text x="502" y="521" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">6</text><text x="515" y="521.5" style="fill:var(--edge-label)" font-size="10.5">6. 200 RondaResult (ganador, puntajes, empate?)</text></g><g class="msg" data-f="spa" data-t="jugador"><line x1="481.0" y1="598" x2="169.0" y2="598" style="stroke:var(--seq-msg)" stroke-width="1.6" marker-end="url(#a1)"/><rect x="160" y="572" width="331" height="19" rx="9.5" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><circle cx="172" cy="581.5" r="7.5" fill="#38bdf822" stroke="#38bdf8"/><text x="172" y="585" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">7</text><text x="185" y="585.5" style="fill:var(--edge-label)" font-size="10.5">7. Scoreboard actualizado · desempate si aplica</text></g><rect class="act" data-id="spa" x="485.0" y="214" width="10" height="384" rx="3" style="fill:var(--act-bg);stroke:var(--act-bd)"/><rect class="act" data-id="api" x="815.0" y="278" width="10" height="256" rx="3" style="fill:var(--act-bg);stroke:var(--act-bd)"/><rect class="act" data-id="db" x="1145.0" y="342" width="10" height="128" rx="3" style="fill:var(--act-bg);stroke:var(--act-bd)"/><rect class="act" data-id="jugador" x="155.0" y="598" width="10" height="0" rx="3" style="fill:var(--act-bg);stroke:var(--act-bd)"/><g class="chip" data-tipo="db" style="cursor:pointer"><rect x="54" y="708" width="15" height="15" rx="5" fill="#34d39926" stroke="#34d399"/><text x="75" y="720" style="fill:var(--sub)" font-size="11.5">db 1</text></g><g class="chip" data-tipo="service" style="cursor:pointer"><rect x="150" y="708" width="15" height="15" rx="5" fill="#a78bfa26" stroke="#a78bfa"/><text x="171" y="720" style="fill:var(--sub)" font-size="11.5">service 1</text></g><g class="chip" data-tipo="ui" style="cursor:pointer"><rect x="246" y="708" width="15" height="15" rx="5" fill="#38bdf826" stroke="#38bdf8"/><text x="267" y="720" style="fill:var(--sub)" font-size="11.5">ui 2</text></g></svg><div class="insights"><div class="ins"><b><span class="dot" style="background:#38bdf8"></span>Contrato real</b><ul><li>Endpoint: POST /partidas/{partida_id}/rondas → RondaResult (201/200).</li><li>Rate limit: 30/min por IP en escritura de partidas/rondas.</li><li>GET /partidas/{id} consulta el estado completo para repintar la UI.</li></ul></div></div></div><div id='det'></div><script>
(function(){
  const root=document.documentElement;
  let tema=localStorage.getItem('dir-tema')||"oscuro"||(matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro');
  let z=parseFloat(localStorage.getItem('dir-zoom')||'1');
  function aplTema(){root.dataset.theme=tema;
    document.getElementById('btn-tema').textContent=tema==='claro'?'🌙':'☀️';
    localStorage.setItem('dir-tema',tema);}
  function aplZoom(){document.getElementById('stage').style.zoom=z;localStorage.setItem('dir-zoom',z);}
  document.getElementById('btn-tema').onclick=ev=>{ev.stopPropagation();tema=tema==='claro'?'oscuro':'claro';aplTema();};
  document.getElementById('btn-zmas').onclick=ev=>{ev.stopPropagation();z=Math.min(1.8,+(z+0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zmenos').onclick=ev=>{ev.stopPropagation();z=Math.max(0.6,+(z-0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zreset').onclick=ev=>{ev.stopPropagation();z=1;aplZoom();};
  window.addEventListener('message',ev=>{const d=ev.data||{};
    if(d.portal==='tema'){tema=d.tema==='claro'?'claro':'oscuro';aplTema();}});
  aplTema();aplZoom();
})();

const DATOS={"jugador": {"titulo": "Jugador", "sub": "", "tipo": "ui", "detalle": "", "ubicacion": "on-premise"}, "spa": {"titulo": "React SPA", "sub": "", "tipo": "ui", "detalle": "", "ubicacion": "GitHub Pages"}, "api": {"titulo": "FastAPI", "sub": "", "tipo": "service", "detalle": "", "ubicacion": "Railway"}, "db": {"titulo": "SQLite", "sub": "", "tipo": "db", "detalle": "", "ubicacion": "Railway"}}, COLORES={"ui": "#38bdf8", "edge": "#2dd4bf", "service": "#a78bfa", "security": "#f59e0b", "db": "#34d399", "job": "#94a3b8", "decision": "#f472b6", "terminal": "#e2e8f0", "source": "#38bdf8", "transform": "#a78bfa", "store": "#34d399", "consumer": "#fbbf24", "start": "#2dd4bf", "waiting": "#fbbf24", "failure": "#fb7185"};
let lens=[];
function aplicar(focus){
  const act=new Set(lens);
  document.querySelectorAll('.node,.life,.act').forEach(g=>{
    const id=g.dataset.id, t=g.dataset.tipo; let dim=false;
    if(act.size&&t) dim=!act.has(t);
    if(focus) dim=id!==focus;
    g.style.opacity=dim?.12:1;
    const card=g.querySelector('.card'); if(card) card.setAttribute('stroke-width', id===focus?2.6:1.4);
  });
  document.querySelectorAll('.msg').forEach(g=>{
    let dim=false;
    if(focus) dim=!(g.dataset.f===focus||g.dataset.t===focus);
    if(act.size&&!focus){const a=document.querySelector(`.node[data-id="${g.dataset.f}"]`).dataset.tipo,
      b=document.querySelector(`.node[data-id="${g.dataset.t}"]`).dataset.tipo; dim=!(act.has(a)&&act.has(b));}
    g.style.opacity=dim?.08:1;
  });
  document.querySelectorAll('.chip').forEach(c=>{
    c.style.opacity=(act.size&&!act.has(c.dataset.tipo))?.4:1;
    c.querySelector('rect').setAttribute('stroke-width', act.has(c.dataset.tipo)?2.4:1);
  });
}
function panel(id){
  const p=document.getElementById('det'), d=DATOS[id];
  if(!id){p.style.display='none';return;}
  const rel=[...document.querySelectorAll(`.msg[data-f="${id}"],.msg[data-t="${id}"]`)]
    .map(g=>{const i=[...document.querySelectorAll('.msg')].indexOf(g)+1;
      const o=g.dataset.f===id?g.dataset.t:g.dataset.f;
      return `<li><b>#${i}</b> ${g.dataset.f===id?'→':'←'} <b>${DATOS[o].titulo}</b></li>`;}).join('');
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
    <b style="color:${COLORES[d.tipo]}">${d.titulo}</b>
    <span style="cursor:pointer;color:var(--muted)" onclick="foco(null)">✕</span></div>
    <div style="color:var(--sub);font-size:12px;margin:.2rem 0">${d.sub} · tipo ${d.tipo}${d.ubicacion?' · 📍 '+d.ubicacion:''}</div>
    <div style="font-size:12.5px;margin:.4rem 0">${d.detalle||''}</div>
    <ul style="margin:.3rem 0 0;padding-left:1.1rem;font-size:12px;color:var(--fg)">${rel}</ul>`;
  p.style.display='block';
}
function foco(id){ window._f=id; aplicar(id); panel(id);
  history.replaceState(null,'',id?'#focus='+id:location.pathname); }
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',ev=>{
  ev.stopPropagation(); foco(window._f===g.dataset.id?null:g.dataset.id);}));
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  const t=c.dataset.tipo, i=lens.indexOf(t);
  if(i>=0) lens.splice(i,1); else { lens.push(t); if(lens.length>2) lens.shift(); }
  aplicar(window._f);
  history.replaceState(null,'',lens.length?'#lens='+lens.join('~'):location.pathname);}));
document.body.addEventListener('click',()=>foco(null));
const h=location.hash;
if(h.startsWith('#focus=')) foco(h.slice(7));
if(h.startsWith('#lens=')){ lens=h.slice(6).split('~'); aplicar(null); }
</script></body></html>
