<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><title>Flujo de datos: dataset → SQLite → API → UI</title><style>:root{--bg:#0b1220;--fg:#e2e8f0;--txt:#f1f5f9;--muted:#64748b;--sub:#8ea0b8;--edge:#94a3b8;--edge-label:#a5b4c9;--chip-bg:#0b1220;--chip-bd:#1e293b;--panel-bg:#0f172a;--panel-bd:#1e293b;--life:#334155;--act-bg:#1e293b;--act-bd:#475569;--seq-msg:#cbd5e1;--seq-ret:#64748b;--shadow:rgba(0,0,0,.35)}:root[data-theme=claro]{--bg:#eef2f7;--fg:#1e293b;--txt:#0f172a;--muted:#64748b;--sub:#5b6b80;--edge:#64748b;--edge-label:#475569;--chip-bg:#ffffff;--chip-bd:#cbd5e1;--panel-bg:#ffffff;--panel-bd:#e2e8f0;--life:#cbd5e1;--act-bg:#e2e8f0;--act-bd:#94a3b8;--seq-msg:#334155;--seq-ret:#94a3b8;--shadow:rgba(15,23,42,.10)}body{background:var(--bg);margin:0;padding:2.2rem;font-family:system-ui;color:var(--fg)}svg{width:100%;max-width:1180px;height:auto;display:block;margin:0 auto}.node,.edge,.chip,.hull,.msg,.life,.act{transition:opacity .18s}.insights{display:flex;gap:1rem;max-width:1180px;margin:1.2rem auto 0;flex-wrap:wrap}.ins{flex:1;min-width:250px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem}.ins b{display:flex;align-items:center;gap:.5rem;font-size:13.5px;color:var(--txt)}.ins .dot{width:9px;height:9px;border-radius:50%;flex:none}.ins ul{margin:.55rem 0 0;padding-left:1.1rem;font-size:12.5px;color:var(--sub);line-height:1.45}.ins li{margin:.28rem 0}#det{display:none;position:fixed;left:2rem;bottom:2rem;max-width:360px;background:var(--panel-bg);border:1px solid var(--panel-bd);border-radius:12px;padding:1rem 1.2rem;box-shadow:0 8px 30px var(--shadow);z-index:9}#toolbar{position:fixed;top:1rem;right:1rem;display:flex;gap:.35rem;z-index:10}#toolbar button{background:var(--panel-bg);border:1px solid var(--panel-bd);color:var(--fg);border-radius:8px;padding:.28rem .55rem;cursor:pointer;font-size:12.5px;font-weight:650}#toolbar button:hover{border-color:var(--edge)}</style></head><body><div id='toolbar'><button id='btn-tema' title='Tema claro/oscuro'>☀</button><button id='btn-zmenos' title='Reducir tamano de fuente'>A−</button><button id='btn-zreset' title='Tamano original'>A</button><button id='btn-zmas' title='Aumentar tamano de fuente'>A+</button></div><div id='stage'><svg viewBox="0 0 1980 263" xmlns="http://www.w3.org/2000/svg" font-family="system-ui"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" style="fill:var(--edge)"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#f472b6"/></marker></defs><text x="60" y="48" style="fill:var(--txt)" font-size="23" font-weight="700">Flujo de datos: dataset → SQLite → API → UI</text><text x="60" y="70" style="fill:var(--muted)" font-size="12">derivado de IR · no editar a mano · clic en un elemento para su detalle</text><g class="hull"><rect x="30" y="91" width="1920" height="138" rx="4" fill="Origen05" stroke="Origen66" stroke-width="1.1" stroke-dasharray="4 6"/><text x="48" y="113" fill="Origen" font-size="10.5" font-weight="700" letter-spacing="1.6">ORIGEN</text></g><g class="hull"><rect x="30" y="91" width="1920" height="138" rx="4" fill="Preparación (local)05" stroke="Preparación (local)66" stroke-width="1.1" stroke-dasharray="4 6"/><text x="48" y="113" fill="Preparación (local)" font-size="10.5" font-weight="700" letter-spacing="1.6">PREPARACION</text></g><g class="hull"><rect x="30" y="91" width="1920" height="138" rx="4" fill="Servicio (Railway)05" stroke="Servicio (Railway)66" stroke-width="1.1" stroke-dasharray="4 6"/><text x="48" y="113" fill="Servicio (Railway)" font-size="10.5" font-weight="700" letter-spacing="1.6">SERVICIO</text></g><g class="hull"><rect x="30" y="91" width="1920" height="138" rx="4" fill="Consumo05" stroke="Consumo66" stroke-width="1.1" stroke-dasharray="4 6"/><text x="48" y="113" fill="Consumo" font-size="10.5" font-weight="700" letter-spacing="1.6">CONSUMO</text></g><g class="edge" data-f="fuentes" data-t="raw"><path d="M270,169.0 L390,169.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="242" y="150.0" width="175" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="330" y="163.0" style="fill:var(--edge-label)" font-size="10.5" text-anchor="middle">descarga y enriquecimiento</text></g><g class="edge" data-f="raw" data-t="seed"><path d="M600,169.0 L720,169.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="594" y="150.0" width="132" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="660" y="163.0" style="fill:var(--edge-label)" font-size="10.5" text-anchor="middle">JSON/CSV de entrada</text></g><g class="edge" data-f="seed" data-t="sqlite"><path d="M930,169.0 L1050,169.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="930" y="150.0" width="119" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="990" y="163.0" style="fill:var(--edge-label)" font-size="10.5" text-anchor="middle">carga idempotente</text></g><g class="edge" data-f="sqlite" data-t="repo"><path d="M1260,169.0 L1380,169.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1232" y="150.0" width="175" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="1320" y="163.0" style="fill:var(--edge-label)" font-size="10.5" text-anchor="middle">SELECT por baraja/atributo</text></g><g class="edge" data-f="repo" data-t="ui"><path d="M1590,169.0 L1710,169.0" fill="none" style="stroke:var(--edge)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1544" y="150.0" width="212" height="18" rx="9" style="fill:var(--chip-bg);stroke:var(--chip-bd)"/><text x="1650" y="163.0" style="fill:var(--edge- class="card" x="720" y="135" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="742" cy="159" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="742" y="163.5" fill="#a78bfa" font-size="11" text-anchor="middle">ƒ</text><text x="762" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">seed.py</text><text x="762" y="185" style="fill:var(--sub)" font-size="11.5">carga idempotente a SQLite…</text><g class="ubadge"><rect x="883" y="127" width="42" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#a78bfa" stroke-width="0.9"/><text x="904" y="138.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">⌂ local</text></g></g><g class="node" data-id="sqlite" data-tipo="db" style="cursor:pointer"><rect x="1052" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="1050" y="135" width="210" height="68" rx="12" fill="#34d39914" stroke="#34d399" stroke-width="1.4"/><circle cx="1072" cy="159" r="11" fill="#34d39926" stroke="#34d39999"/><text x="1072" y="163.5" fill="#34d399" font-size="11" text-anchor="middle">⛁</text><text x="1092" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">topbirds.db</text><text x="1092" y="185" style="fill:var(--sub)" font-size="11.5">tablas aves · atributos · pa…</text><g class="ubadge"><rect x="1200" y="127" width="55" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#34d399" stroke-width="0.9"/><text x="1228" y="138.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ Railway</text></g></g><g class="node" data-id="repo" data-tipo="service" style="cursor:pointer"><rect x="1382" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="1380" y="135" width="210" height="68" rx="12" fill="#a78bfa14" stroke="#a78bfa" stroke-width="1.4"/><circle cx="1402" cy="159" r="11" fill="#a78bfa26" stroke="#a78bfa99"/><text x="1402" y="163.5" fill="#a78bfa" font-size="11" text-anchor="middle">⟨⟩</text><text x="1422" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">repository.py</text><text x="1422" y="185" style="fill:var(--sub)" font-size="11.5">consultas SQL tipadas vía s…</text><g class="ubadge"><rect x="1530" y="127" width="55" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#a78bfa" stroke-width="0.9"/><text x="1558" y="138.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">☁ Railway</text></g></g><g class="node" data-id="ui" data-tipo="consumer" style="cursor:pointer"><rect x="1712" y="138" width="210" height="68" rx="12" style="fill:var(--shadow)"/><rect class="card" x="1710" y="135" width="210" height="68" rx="12" fill="#fbbf2414" stroke="#fbbf24" stroke-width="1.4"/><circle cx="1732" cy="159" r="11" fill="#fbbf2426" stroke="#fbbf2499"/><text x="1732" y="163.5" fill="#fbbf24" font-size="11" text-anchor="middle">▸</text><text x="1752" y="164" style="fill:var(--txt)" font-size="14.0" font-weight="650">Cartas y dinámicas</text><text x="1752" y="185" style="fill:var(--sub)" font-size="11.5">SPA: carta, barajas, rondas,…</text><g class="ubadge"><rect x="1839" y="127" width="76" height="16" rx="8" style="fill:var(--chip-bg)" stroke="#fbbf24" stroke-width="0.9"/><text x="1877" y="138.4" font-size="9" text-anchor="middle" style="fill:var(--sub)">◈ GitHub Pages</text></g></g><g class="chip" data-tipo="source" style="cursor:pointer"><rect x="1338" y="58" width="15" height="15" rx="5" fill="#38bdf826" stroke="#38bdf8"/><text x="1359" y="70" style="fill:var(--sub)" font-size="11.5">source 1</text></g><g class="chip" data-tipo="store" style="cursor:pointer"><rect x="1434" y="58" width="15" height="15" rx="5" fill="#34d39926" stroke="#34d399"/><text x="1455" y="70" style="fill:var(--sub)" font-size="11.5">store 1</text></g><g class="chip" data-tipo="transform" style="cursor:pointer"><rect x="1530" y="58" width="15" height="15" rx="5" fill="#a78bfa26" stroke="#a78bfa"/><text x="1551" y="70" style="fill:var(--sub)" font-size="11.5">transform 1</text></g><g class="chip" data-tipo="db" style="cursor:pointer"><rect x="1626" y="58" width="15" height="15" rx="5" fill="#34d39926" stroke="#34d399"/><text x="1647" y="70" style="fill:var(--sub)" font-size="11.5">db 1</text></g><g class="chip" data-tipo="service" style="cursor:pointer"><rect x="1722" y="58" width="15" height="15" rx="5" fill="#a78bfa26" stroke="#a78bfa"/><text x="1743" y="70" style="fill:var(--sub)" font-size="11.5">service 1</text></g><g class="chip" data-tipo="consumer" style="cursor:pointer"><rect x="1818" y="58" width="15" height="15" rx="5" fill="#fbbf2426" stroke="#fbbf24"/><text x="1839" y="70" style="fill:var(--sub)" font-size="11.5">consumer 1</text></g></svg><div class="insights"><div class="ins"><b><span class="dot" style="background:#38bdf8"></span>Gobernanza de datos</b><ul><li>El dataset raw NO se versiona (data-governance.md): solo el .db derivado viaja con el deploy.</li><li>El seed es idempotente: re-correrlo no duplica aves ni atributos.</li><li>Las imágenes se sirven estáticas; la API solo expone metadatos y URLs.</li></ul></div></div></div><div id='det'></div><script>
(function(){
  const root=document.documentElement;
  let tema=localStorage.getItem('dir-tema')||"oscuro"||(matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro');
  let z=parseFloat(localStorage.getItem('dir-zoom')||'1');
  function aplTema(){root.dataset.theme=tema;
    document.getElementById('btn-tema').textContent=tema==='claro'?'🌙':'☀️';
    localStorage.setItem('dir-tema',tema);}
  function aplZoom(){document.getElementById('stage').style.zoom=z;localStorage.setItem('dir-zoom',z);}
  document.getElementById('btn-tema').onclick=ev=>{ev.stopPropagation();tema=tema==='claro'?'oscuro':'claro';aplTema();};
  document.getElementById('btn-zmas').onclick=ev=>{ev.stopPropagation();z=Math.min(1.8,+(z+0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zmenos').onclick=ev=>{ev.stopPropagation();z=Math.max(0.6,+(z-0.1).toFixed(2));aplZoom();};
  document.getElementById('btn-zreset').onclick=ev=>{ev.stopPropagation();z=1;aplZoom();};
  window.addEventListener('message',ev=>{const d=ev.data||{};
    if(d.portal==='tema'){tema=d.tema==='claro'?'claro':'oscuro';aplTema();}});
  aplTema();aplZoom();
})();

const DATOS={"fuentes": {"titulo": "Fuentes abiertas", "sub": "listas de aves de Colombia (taxonomía, atributos)", "tipo": "source", "grupo": "origen", "detalle": "", "ubicacion": "cloud"}, "raw": {"titulo": "topbirds_dataset/ (raw)", "sub": "JSON enriquecido + imágenes · gitignored (data-governance)", "tipo": "store", "grupo": "preparacion", "detalle": "", "ubicacion": "local"}, "seed": {"titulo": "seed.py", "sub": "carga idempotente a SQLite (aves, atributos)", "tipo": "transform", "grupo": "preparacion", "detalle": "", "ubicacion": "local"}, "sqlite": {"titulo": "topbirds.db", "sub": "tablas aves · atributos · partidas · rondas", "tipo": "db", "grupo": "servicio", "detalle": "", "ubicacion": "Railway"}, "repo": {"titulo": "repository.py", "sub": "consultas SQL tipadas vía schemas Pydantic", "tipo": "service", "grupo": "servicio", "detalle": "", "ubicacion": "Railway"}, "ui": {"titulo": "Cartas y dinámicas", "sub": "SPA: carta, barajas, rondas, quiz (HU-10..HU-17)", "tipo": "consumer", "grupo": "consumo", "detalle": "", "ubicacion": "GitHub Pages"}}, RELS={"fuentes": [["→", "raw", "descarga y enriquecimiento"]], "raw": [["←", "fuentes", "descarga y enriquecimiento"], ["→", "seed", "JSON/CSV de entrada"]], "seed": [["←", "raw", "JSON/CSV de entrada"], ["→", "sqlite", "carga idempotente"]], "sqlite": [["←", "seed", "carga idempotente"], ["→", "repo", "SELECT por baraja/atributo"]], "repo": [["←", "sqlite", "SELECT por baraja/atributo"], ["→", "ui", "GET /aves · /barajas · /partidas"]], "ui": [["←", "repo", "GET /aves · /barajas · /partidas"]]}, COLORES={"ui": "#38bdf8", "edge": "#2dd4bf", "service": "#a78bfa", "security": "#f59e0b", "db": "#34d399", "job": "#94a3b8", "decision": "#f472b6", "terminal": "#e2e8f0", "source": "#38bdf8", "transform": "#a78bfa", "store": "#34d399", "consumer": "#fbbf24", "start": "#2dd4bf", "waiting": "#fbbf24", "failure": "#fb7185"};
let lens=[];
function aplicar(focus){
  const act=new Set(lens);
  document.querySelectorAll('.node').forEach(g=>{
    const id=g.dataset.id, t=g.dataset.tipo; let dim=false;
    if(act.size) dim=!act.has(t);
    if(focus) dim=!(id===focus||(RELS[focus]||[]).some(r=>r[1]===id));
    g.style.opacity=dim?.12:1;
    const card=g.querySelector('.card'); if(card) card.setAttribute('stroke-width', id===focus?2.6:1.4);
  });
  document.querySelectorAll('.edge').forEach(g=>{
    let dim=false;
    if(focus) dim=!(g.dataset.f===focus||g.dataset.t===focus);
    if(act.size&&!focus){const a=document.querySelector(`.node[data-id="${g.dataset.f}"]`).dataset.tipo,
      b=document.querySelector(`.node[data-id="${g.dataset.t}"]`).dataset.tipo; dim=!(act.has(a)&&act.has(b));}
    g.style.opacity=dim?.08:1;
  });
  document.querySelectorAll('.chip').forEach(c=>{
    c.style.opacity=(act.size&&!act.has(c.dataset.tipo))?.4:1;
    c.querySelector('rect').setAttribute('stroke-width', act.has(c.dataset.tipo)?2.4:1);
  });
  document.querySelectorAll('.hull').forEach(h=>h.style.opacity=focus?.25:.9);
}
function panel(id){
  const p=document.getElementById('det'), d=DATOS[id];
  if(!id){p.style.display='none';return;}
  const rel=(RELS[id]||[]).map(r=>`<li>${r[0]} <b>${DATOS[r[1]].titulo}</b> <span style="color:var(--muted)">· ${r[2]}</span></li>`).join('');
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
    <b style="color:${COLORES[d.tipo]}">${d.titulo}</b>
    <span style="cursor:pointer;color:var(--muted)" onclick="foco(null)">✕</span></div>
    <div style="color:var(--sub);font-size:12px;margin:.2rem 0">${d.sub} — ${d.grupo||''} · tipo ${d.tipo}${d.ubicacion?' · 📍 '+d.ubicacion:''}</div>
    <div style="font-size:12.5px;margin:.4rem 0">${d.detalle||''}</div>
    <ul style="margin:.3rem 0 0;padding-left:1.1rem;font-size:12px;color:var(--fg)">${rel}</ul>`;
  p.style.display='block';
}
function foco(id){ window._f=id; aplicar(id); panel(id);
  history.replaceState(null,'',id?'#focus='+id:location.pathname); }
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',ev=>{
  ev.stopPropagation(); foco(window._f===g.dataset.id?null:g.dataset.id);}));
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  const t=c.dataset.tipo, i=lens.indexOf(t);
  if(i>=0) lens.splice(i,1); else { lens.push(t); if(lens.length>2) lens.shift(); }
  aplicar(window._f);
  history.replaceState(null,'',lens.length?'#lens='+lens.join('~'):location.pathname);}));
document.body.addEventListener('click',()=>foco(null));
const h=location.hash;
if(h.startsWith('#focus=')) foco(h.slice(7));
if(h.startsWith('#lens=')){ lens=h.slice(6).split('~'); aplicar(null); }
</script></body></html>
