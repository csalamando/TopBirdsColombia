openapi: 3.0.3
info:
  title: Top Trumps Aves de Colombia API
  version: 1.0.0
  description: API REST para el juego Top Trumps con aves de Colombia.

servers:
  - url: http://localhost:8000
    description: Desarrollo local
  - url: https://api.topbirds-demo.example.com
    description: Demo

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /aves:
    get:
      summary: Listar aves
      operationId: listAves
      responses:
        "200":
          description: Lista de aves
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ave"
        "500":
          description: Error interno

  /aves/{aveId}:
    get:
      summary: Obtener ave por ID
      operationId: getAve
      parameters:
        - name: aveId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Datos del ave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ave"
        "404":
          description: Ave no encontrada

  /barajas:
    get:
      summary: Listar barajas disponibles
      operationId: listBarajas
      responses:
        "200":
          description: Lista de barajas con cantidad de aves
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BarajaInfo"
        "500":
          description: Error interno

  /partidas:
    post:
      summary: Crear partida
      operationId: createPartida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartidaRequest"
      responses:
        "201":
          description: Partida creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partida"
        "400":
          description: Solicitud inválida
        "422":
          description: Error de validación (p. ej. baraja inexistente)

  /partidas/{partidaId}:
    get:
      summary: Obtener estado de partida
      operationId: getPartida
      parameters:
        - name: partidaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estado de la partida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partida"
        "404":
          description: Partida no encontrada

  /partidas/{partidaId}/rondas:
    post:
      summary: Jugar una ronda
      operationId: playRonda
      parameters:
        - name: partidaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayRondaRequest"
      responses:
        "200":
          description: Resultado de la ronda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RondaResult"
        "400":
          description: Solicitud inválida
        "404":
          description: Partida no encontrada
        "409":
          description: Partida finalizada

components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    Ave:
      type: object
      required:
        - id
        - nombre_comun
        - nombre_cientifico
        - atributos
      properties:
        id:
          type: integer
        nombre_comun:
          type: string
        nombre_ingles:
          type: string
          nullable: true
        nombre_cientifico:
          type: string
        orden:
          type: string
          nullable: true
        familia:
          type: string
          nullable: true
        habitat:
          type: string
          nullable: true
        dieta:
          type: string
          nullable: true
        atribucion:
          type: string
          nullable: true
        imagen_url:
          type: string
          format: uri
          nullable: true
        estado_conservacion_uicn:
          type: string
          enum: [LC, NT, VU, EN, CR]
          nullable: true
        endemismo:
          type: string
          nullable: true
        es_dimorfica:
          type: boolean
          default: false
        estacionalidad:
          type: string
          nullable: true
          description: HU-15; p. ej. "Residente" o "Migratoria Boreal" (badge visitante boreal, temporada nov-feb)
        regiones:
          type: array
          items:
            type: string
          description: Regiones canónicas de Colombia (andina, caribe, pacifico, amazonia, orinoquia)
        variantes_imagen:
          type: array
          items:
            $ref: "#/components/schemas/VarianteImagen"
        atributos:
          $ref: "#/components/schemas/Atributos"

    VarianteImagen:
      type: object
      required:
        - sexo
        - es_principal
      properties:
        sexo:
          type: string
          enum: [macho, hembra, indeterminado]
        es_principal:
          type: boolean
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: RN-19; imagen de la carta en calidad original (copia sin pérdida del JPG del dataset) servida por el frontend; null si la especie no tiene imagen
        fotografo:
          type: string
          nullable: true
        licencia:
          type: string
          enum: [cc-by, cc0, cc-by-sa]
          nullable: true
        url_observacion:
          type: string
          format: uri
          nullable: true

    Atributos:
      type: object
      required:
        - tamano_cm
        - peso_g
        - envergadura_cm
        - velocidad_kmh
        - esperanza_vida_anos
        - rareza
      properties:
        tamano_cm:
          type: number
        peso_g:
          type: number
        envergadura_cm:
          type: number
        velocidad_kmh:
          type: number
        esperanza_vida_anos:
          type: number
        rareza:
          type: integer
          minimum: 1
          maximum: 10
        altitud_max_msnm:
          type: number
          nullable: true
          description: Atributo oculto (RN-11); solo se compara en la ronda especial

    CreatePartidaRequest:
      type: object
      required:
        - modo
      properties:
        modo:
          type: string
          enum:
            - ia
            - hotseat
        jugador_nombre:
          type: string
        baraja:
          type: string
          description: Id de baraja ("completa" o id de región), "aleatoria" por defecto
          default: aleatoria

    BarajaInfo:
      type: object
      required:
        - id
        - nombre
        - cantidad
      properties:
        id:
          type: string
          example: amazonia
        nombre:
          type: string
          example: "Expedición: Amazonía"
        cantidad:
          type: integer
          example: 24
        imagen_url:
          type: string
          format: uri
          nullable: true
          description: RN-20; imagen representativa = primera carta del mazo (orden canónico) con foto; null si ninguna la tiene

    Partida:
      type: object
      required:
        - id
        - modo
        - estado
        - turno
        - cartas_jugador
        - cartas_oponente
      properties:
        id:
          type: string
        modo:
          type: string
          enum:
            - ia
            - hotseat
        baraja:
          type: string
          description: Id de la baraja efectivamente usada en la partida
        bono_dimorfico_usado:
          type: boolean
          default: false
          description: RN-10; true cuando el bono "¿Macho o hembra?" ya se usó
        estado:
          type: string
          enum:
            - activa
            - finalizada
        turno:
          type: string
          enum:
            - jugador
            - oponente
        cartas_jugador:
          type: integer
        cartas_oponente:
          type: integer
        carta_activa:
          $ref: "#/components/schemas/Ave"
        ganador:
          type: string
          nullable: true

    PlayRondaRequest:
      type: object
      required:
        - atributo
      properties:
        atributo:
          type: string
          enum:
            - tamano_cm
            - peso_g
            - envergadura_cm
            - velocidad_kmh
            - esperanza_vida_anos
            - rareza
            - altitud_max_msnm
        sexo_oponente:
          type: string
          enum: [macho, hembra]
          nullable: true
          description: RN-10; apuesta del bono "¿Macho o hembra?" (solo si aplica)

    RondaResult:
      type: object
      required:
        - atributo
        - valor_jugador
        - valor_oponente
        - resultado
        - cartas_jugador
        - cartas_oponente
      properties:
        atributo:
          type: string
        valor_jugador:
          type: number
        valor_oponente:
          type: number
        resultado:
          type: string
          enum:
            - gana_jugador
            - gana_oponente
            - empate
        bono_ofrecido:
          type: boolean
          default: false
          description: RN-10; true si la ronda admitía el bono de dimorfismo
        bono_acierto:
          type: boolean
          nullable: true
          description: RN-10; resultado de la apuesta (null si no se usó el bono)
        combo_orden:
          type: string
          nullable: true
          description: RN-12; orden taxonómico de la carta ganadora cuando hay combo (2 victorias consecutivas del mismo ganador con aves del mismo orden)
        combo_bonus:
          type: boolean
          default: false
          description: RN-12; true si el combo sumó +1 carta del reservorio al ganador
        carta_jugador:
          $ref: "#/components/schemas/Ave"
        carta_oponente:
          $ref: "#/components/schemas/Ave"
        cartas_jugador:
          type: integer
        cartas_oponente:
          type: integer
        reserva:
          type: integer
        ganador_partida:
          type: string
          nullable: true
