services:
  - type: web
    name: topbirds-colombia-api
    runtime: docker
    repo: https://github.com/csalamando/TopBirdsColombia
    dockerfilePath: ./src/backend/Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: /app/data/topbirds.db
      - key: CORS_ORIGINS
        value: "https://topbirds-colombia.onrender.com,http://localhost:8000"
    healthCheckPath: /health
    plan: free
